<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GaeunMemo</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="note.css">
  <script src="boot.js"></script>
  <script src="ui.js" defer></script>
  <script src="rich.js" defer></script>
  <script src="note.js" defer></script>
</head>
<body>
  <div class="band" id="band"></div>
  <header class="bar" id="bar">
    <svg class="icon round lock-ico" id="lock-ico" viewBox="0 0 14 14" aria-label="잠김" hidden><rect x="3" y="6.2" width="8" height="5.6" rx="1"/><path d="M4.8 6.2V4.6a2.2 2.2 0 0 1 4.4 0v1.6"/></svg>
    <input id="title" class="title" placeholder="제목" readonly tabindex="-1" spellcheck="false" autocomplete="off" maxlength="500" aria-label="제목">
    <span class="copied" id="copied" aria-live="polite" hidden>
      <svg class="icon round" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.4l2.6 2.6L11 4.4"/></svg>복사됨
    </span>
    <div class="tools">
      <button class="tool" id="pin" aria-label="항상 위에 고정" title="항상 위에 고정" aria-pressed="false">
        <svg class="icon round" viewBox="0 0 14 14" aria-hidden="true"><path class="pin-head" d="M8.2 2.2l3.6 3.6-1.8.6-1.9 1.9.2 1.9-.9.9L3.9 6.6l.9-.9 1.9.2 1.9-1.9z"/><path d="M5.6 8.4L2.5 11.5"/></svg>
      </button>
      <button class="tool" id="new" aria-label="새 메모" title="새 메모 (Ctrl+N)">
        <svg class="icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9"/></svg>
      </button>
      <button class="tool" id="more" aria-label="더보기" title="더보기" aria-haspopup="menu" aria-expanded="false">
        <svg class="icon" viewBox="0 0 14 14" aria-hidden="true"><rect class="solid" x="2" y="6" width="2" height="2"/><rect class="solid" x="6" y="6" width="2" height="2"/><rect class="solid" x="10" y="6" width="2" height="2"/></svg>
      </button>
      <button class="tool" id="restore" aria-label="원래 크기" title="원래 크기" hidden>
        <svg class="icon round" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 2.5l3.2 3.2M5.7 2.8v2.9H2.8M11.5 11.5L8.3 8.3M8.3 11.2V8.3h2.9"/></svg>
      </button>
      <button class="tool" id="close" aria-label="닫기" title="닫기 (Ctrl+W)">
        <svg class="icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg>
      </button>
    </div>
  </header>

  <!-- formatting row: only in 전체화면 -->
  <div class="fmt" id="fmt" role="toolbar" aria-label="서식" hidden>
    <button class="fbtn" data-cmd="bold" aria-label="굵게" title="굵게 (Ctrl+B)"><b>B</b></button>
    <button class="fbtn" data-cmd="italic" aria-label="기울임" title="기울임 (Ctrl+I)"><i>I</i></button>
    <button class="fbtn" data-cmd="underline" aria-label="밑줄" title="밑줄 (Ctrl+U)"><u>U</u></button>
    <button class="fbtn" data-cmd="strikeThrough" aria-label="취소선" title="취소선"><s>S</s></button>
    <span class="fsep"></span>
    <button class="fbtn" data-cmd="insertUnorderedList" aria-label="글머리 기호" title="글머리 기호">
      <svg class="icon round" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.5 3.5h6M5.5 7h6M5.5 10.5h6"/><circle class="dot" cx="2.6" cy="3.5" r=".9"/><circle class="dot" cx="2.6" cy="7" r=".9"/><circle class="dot" cx="2.6" cy="10.5" r=".9"/></svg>
    </button>
    <span class="fsep"></span>
    <button class="fbtn" id="img-btn" aria-label="사진 넣기" title="사진 넣기">
      <svg class="icon round" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="3" width="10" height="8" rx="1"/><circle cx="5" cy="5.8" r="1"/><path d="M2.6 10.4l3-3 2 2 1.4-1.4 2.4 2.4"/></svg>
    </button>
    <input type="file" id="img-file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
  </div>

  <div id="body" class="body" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="메모" data-placeholder="메모"></div>

  <div class="menu" id="menu" role="menu" hidden>
    <button class="menu-item" role="menuitem" data-act="rename" data-lockable>제목 수정</button>
    <div class="swatches" id="swatches" role="radiogroup" aria-label="색상"></div>
    <button class="menu-item has-value" role="menuitem" data-act="band" id="band-btn">
      <span>띠 모양</span><span class="menu-value" id="band-value">얇은 띠</span>
    </button>
    <button class="menu-item" role="menuitem" data-act="full" id="full-btn">전체화면</button>
    <button class="menu-item" role="menuitem" data-act="lock" id="lock-btn">잠금</button>
    <button class="menu-item" role="menuitem" data-act="theme" id="theme-btn">라이트 모드</button>
    <button class="menu-item" role="menuitem" data-act="list">메모 목록</button>
    <button class="menu-item" role="menuitem" data-act="delete" data-lockable>메모 삭제</button>
  </div>

  <div class="confirm" id="confirm" role="alertdialog" aria-labelledby="confirm-msg" hidden>
    <div class="confirm-card">
      <p id="confirm-msg">삭제하시겠습니까?</p>
      <div class="actions">
        <button class="btn" id="confirm-keep">유지</button>
        <button class="btn strong" id="confirm-delete">삭제</button>
      </div>
    </div>
  </div>
</body>
</html>
